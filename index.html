<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cidadan.ia</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .navbar {
      background-color: #176ad6;
      width: 100%;
      height: 93px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 45px;
      position: relative;
    }

    .logo {
      font-family: 'Trebuchet MS', sans-serif;
      color: white;
      font-size: 45px;
      margin: 0;
      padding: 0;
      line-height: 1;
    }

    .nav-list {
      display: flex;
      list-style: none;
      margin-right: 375px;
      margin-top: 5px;
    }

    .nav-list a {
      color: white;
      font-family: 'Trebuchet MS', sans-serif;
      font-size: 18px;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 20px;
      transition: background-color 0.2s ease;
    }

    .nav-list a:hover {
      background-color: #0f4ac9;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: white;
      cursor: pointer;
    }

    .container {
      width: 80%;
      margin: auto;
      height: 88vh;
    }

    .responsive-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 900px) {
      .navbar {
        padding: 0 25px;
      }

      .menu-toggle {
        display: block;
      }

      .nav-list {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 93px;
        left: 0;
        width: 100%;
        background-color: #176ad6;
        margin: 0;
        padding: 20px 0;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        z-index: 10;
      }

      .nav-list.active {
        display: flex;
      }

      .nav-list li {
        text-align: center;
        margin: 5px 0;
      }

      .nav-list a {
        display: inline-block;
        width: 80%;
      }
    }
  </style>

  <body>
    <div class="navbar">
      <h1 class="logo">Cidadan.ia</h1>

      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">
        <span class="material-symbols-outlined" style="font-size: 38px;">menu</span>
      </button>

      <ul class="nav-list" id="nav-list">
        <li><a href="index.html">Assistente Legal</a></li>
        <li><a href="iasobre.html">Sobre nós</a></li>
        <li><a href="iacontato.html">Contato</a></li>
      </ul>
    </div>

    <div class="container">
      <iframe
        class="responsive-iframe"
        src="https://www.chatbase.co/chatbot-iframe/kyv5X8GkHaVztVqJrZdJO"
        title="Chatbot"
      ></iframe>
    </div>

    <script>
      const menuToggle = document.getElementById('menu-toggle');
      const navList = document.getElementById('nav-list');

      menuToggle.addEventListener('click', () => {
        navList.classList.toggle('active');
      });
    </script>
  </body>
</html>
